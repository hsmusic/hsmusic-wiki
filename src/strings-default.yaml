    expandDescription:
      _: "({EXPAND})"
      expand: "Expand description..."

    expandDescription.orReadMore:
      _: "({EXPAND}, or read more on {LINKS})"
      expand: "Expand description"

    collapseDescription:
      _: "({COLLAPSE})"
      collapse: "Collapse description"

    collapseDescription.orReadMore:
      _: "({COLLAPSE}, or read more on {LINKS})"
      collapse: "Collapse description"

  # nav:
  #   Generic navigational elements. These usually only appear in the
  #   wiki's nav bar, at the top of the page.

  nav:
    previous: "Previous"
    next: "Next"

    info: "Info"
    gallery: "Gallery"
    rollingWindow: "Rolling Window"

  # pageTitle:
  #   Text set under the page's <title> HTML element, which is
  #   displayed in the browser tab bar, bookmarks list, etc.

  pageTitle:
    _: >-
      {TITLE}

    withDetail: >-
      {TITLE} ({DETAIL})

    withSubtitle: >-
      {TITLE} - {SUBTITLE}

    withWikiName: >-
      {TITLE} | {WIKI_NAME}

    withDetail.withSubtitle: >-
      {TITLE} ({DETAIL}) - {SUBTITLE}

    withDetail.withWikiName: >-
      {TITLE} ({DETAIL}) | {WIKI_NAME}

    withSubtitle.withWikiName: >-
      {TITLE} - {SUBTITLE} | {WIKI_NAME}

    withDetail.withSubtitle.withWikiName: >-
      {TITLE} ({DETAIL}) - {SUBTITLE} | {WIKI_NAME}

  # pageHeading:
  #   Text set inside the page's <h1> HTML element, which is
  #   displayed at the top of the content area.

  pageHeading:
    _: >-
      {TITLE}

    withDetail: >-
      {TITLE} {DETAIL_ACCENT}

    withDetail.accent: "({DETAIL})"

  # search:
  #   Strings to do with the search bar!

  search:
    placeholder: "Search for anything"

    preparing: "Preparing..."
    loadingData: "Loading data..."
    searching: "Searching..."

    failed: >-
      There was an internal error,
      and your search couldn't be processed.
      Reloading this page and trying again may help.
      Sorry for the trouble!

    noResults: >-
      No results for this query, sorry!
      Check spelling and use complete words.

    back: "Return to: {PAGE}"

    currentResult: "(you are here)"
    endSearch: "(OK, I'm done searching now.)"

    resultKind:
      album: "(album)"
      artTag: "(art tag)"
      artist: "(artist)"
      flash: "(flash)"
      group: "(group)"
      single: "(single)"
      vgmAlbum: "(in-game vgm)"

    resultDisambiguator:
      group: "({CATEGORY})"
      flash: "(in {ACT})"
      track.album: "(from {ALBUM})"
      track.artists: "(by {ARTISTS})"

    resultFilter:
      album: "Releases"
      artTag: "Art Tags"
      artist: "Artists"
      flash: "Flashes"
      group: "Groups"
      track: "Tracks"

  referencingSources:
    _: "{CUE} for {THING}:"
    withoutName: "{CUE}:"

    collapsed: "{CUE} for {THING}…"
    withoutName.collapsed: "{CUE}…"

    cue: "Referencing sources"
    sticky: "Referencing sources:"

  # skippers:
  #
  #   These are navigational links that only show up when you're
  #   navigating the wiki using the Tab key (or some other method of
  #   "tabbing" between links and interactive elements). They move
  #   the browser's nav focus to the selected element when pressed.
  #
  #   There are a lot of definitions here, and they're mostly shown
  #   conditionally, based on the elements that are actually apparent
  #   on the current page.
  #

  skippers:
    skipTo: "Skip to:"

    content: "Content"
    header: "Header"
    footer: "Footer"

    sidebar:
      _: "Sidebar"
      left: "Sidebar (left)"
      right: "Sidebar (right)"

    # Displayed on various info pages.

    artistCommentary: "Artist commentary"
    creditingSources: "Crediting sources"

    # Displayed on artist info page.

    tracks: "Tracks"
    artworks: "Artworks"
    flashes: "Flashes"
    commentary: "Commentary"

    # Displayed on track and flash info pages.

    contributors: "Contributors"

    # Displayed on track info page.

    references: "References..."
    referencedBy: "Referenced by..."
    samples: "Samples..."
    sampledBy: "Sampled by..."
    features: "Features..."
    featuredIn: "Featured in..."
    referencingSources: "Referencing sources"

    lyrics: "Lyrics"

    sheetMusicFiles: "Sheet music files"
    midiProjectFiles: "MIDI/project files"

    # Displayed on track and album info pages.

    additionalFiles: "Additional files"

  # socialEmbed:
  #   Social embeds describe how the page should be represented on
  #   social platforms, chat messaging apps, and so on.

  socialEmbed:
    heading: "{WIKI_NAME} | {HEADING}"

  # jumpTo:
  #   Generic action displayed at the top of some longer pages, for
  #   quickly scrolling down to a particular section.

  jumpTo:
    _: "Jump to:"
    withLinks: "Jump to: {LINKS}."

  # contentWarnings:
  #   Displayed for some artworks, informing of possibly sensitive
  #   content and giving the viewer a chance to consider before
  #   clicking through.

  contentWarnings:
    warnings: "{WARNINGS}"
    reveal: "click to show"

  # coverArtwork:
  #   Generic or particular strings for artworks outside a grid
  #   context, when just one cover is being spotlighted.

  coverArtwork:
    artworkBy: >-
      Artwork by {ARTISTS}

    artworkBy.customLabel: >-
      {LABEL} by {ARTISTS}

    artworkBy.withYear: >-
      Artwork ({YEAR}) by {ARTISTS}

    artworkBy.customLabel.withYear: >-
      {LABEL} ({YEAR}) by {ARTISTS}

    source: >-
      Via {SOURCE}

    source.customLabel: >-
      {LABEL} via {SOURCE}

    source.withYear: >-
      Via {SOURCE} ({YEAR})

    source.customLabel.withYear: >-
      {LABEL} ({YEAR}) via {SOURCE}

    customLabel: >-
      {LABEL}

    customLabel.withYear: >-
      {LABEL} ({YEAR})

    year: >-
      Released {YEAR}

    trackArtFromAlbum: "Album cover for {ALBUM}"

    sameTagsAsMainArtwork: "Same tags as main artwork"

  # musicVideo:
  #   Strings for music videos, which are presented in a very similar
  #   fashion as cover artworks, although the strings are structured
  #   a bit differently.

  musicVideo:
    label: "Music video!"
    label.customLabel: "{LABEL}!"
    label.customLabel.title: "{TITLE}"
    label.customLabel.besideTitle: "{LABEL}"

    watchOn: >-
      Watch on: {LINKS}

    artistsLine: >-
      Music video {CREDIT}

    artistsLine.customLabel: >-
      {LABEL} {CREDIT}

    artistsLine.credit: >-
      by {ARTISTS}

    artistsLine.noLabel:
      By {ARTISTS}

    date: >-
      Released {DATE}

    date.sameDayAsTrack: >-
      Released alongside this track

    date.sameDayAsAlbum: >-
      Released alongside this album

    date.sameDayAsSingle: >-
      Released alongside this single

    contributorsLine: >-
      Contributors: {CREDIT}

    contributorsLine.credit: >-
      {ARTISTS}

    contributorsList.title: >-
      Contributors:

  # coverGrid:
  #   Generic strings for various sorts of gallery grids, displayed
  #   on the homepage, album galleries, artist artwork galleries, and
  #   so on. These get the name of the thing being represented and,
  #   often, a bit of text providing pertinent extra details about
  #   that thing.

  coverGrid:
    revealAll:
      reveal: "Reveal all artworks"
      conceal: "Conceal all artworks"
      warnings: "In this gallery: {WARNINGS}"

    expandCollapseCue: "({CUE})"
    expand: "Show the rest!"
    collapse: "Collapse these"

    noCoverArt: "{ALBUM}"

    tab:
      groups: "{GROUPS}"
      artists: "{ARTISTS}"
      artists.featuring: "{ARTISTS} feat. {FEATURING}"

    details:
      notFromThisGroup: "{NAME}{MARKER}"
      notFromThisGroup.marker: "*"

      accent: "({DETAILS})"

      albumLength: >-
        {TRACKS}, {TIME}
      albumLength.single: >-
        single, {TIME}
      albumLength.single.withMultipleTracks: >-
        single, {TRACKS}, {TIME}+
      albumLength.tracksOnly: >-
        {TRACKS}

      coverArtists: "Artwork by {ARTISTS}"
      coverArtists.customLabel: "{LABEL} by {ARTISTS}"

      otherCoverArtists: "With {ARTISTS}"

  albumGalleryGrid:
    noCoverArt: "{NAME}"

  # uiLanguage:
  #   Displayed in the footer, for switching between languages.

  uiLanguage: "UI Language: {LANGUAGES}"

#
# homepage:
#   This is the main index and home for the whole wiki! There isn't
#   much for strings here as the layout is very customizable and
#   includes mostly wiki-provided content.
#
homepage:
  title: "{TITLE}"

  # news:
  #   If the wiki has news entries enabled, then there's a box in the
  #   homepage's sidebar (beneath custom sidebar content, if any)
  #   which displays the bodies the latest few entries up to a split.

  news:
    title: "News"

    entry:
      viewRest: "(View rest of entry!)"

#
# albumSidebar:
#   This sidebar is displayed on both the album and track info pages!
#   It displays the groups that the album is from (each getting its
#   own box on the album page, all conjoined in one box on the track
#   page) and the list of tracks in the album, which can be sectioned
#   similarly to normal track lists, but displays the range of tracks
#   in each section rather than the section's duration.
#
albumSidebar:
  trackList:
    item: "{TRACK}"
    item.withDetail: "{TRACK} {DETAIL_ACCENT}"
    item.withDetail.accent: "({DETAIL})"

    # fallbackSectionName:
    #   If an album's track list isn't sectioned, the track list here
    #   will still have all the tracks grouped under a list that can
    #   be toggled open and closed. This controls how that list gets
    #   titled.

    fallbackSectionName: "Track list"

    # group:
    #   "Group" is a misnomer - these are track sections. Some albums
    #   don't use track numbers at all, and for these, the default
    #   string will be used instead of group.withRange.

    group:
      _: "{GROUP}"

      withRange: "{GROUP} {RANGE_PART}"
      withRange.rangePart: "({RANGE})"

  # groupBox:
  #   This is the box for groups. Apart from the next and previous
  #   links, it also gets "visit on" and the group's descripton
  #   (up to a split).

  groupBox:
    title: "{GROUP}"
    next: "Next: {ALBUM}"
    previous: "Previous: {ALBUM}"

  # releaseBox:
  #   This is the narrow box for alternate releases of the
  #   current track.

  releaseBox:
    title: "{ALBUM}"

#
# albumSecondaryNav:
#   The secondary nav bar is shown in medium and thin layouts,
#   and provides access to the same navigational features present
#   in the sidebar (with a more compact view).
#
albumSecondaryNav:
  group: >-
    {GROUP}

  group.withPreviousNext: >-
    {GROUP} ({PREVIOUS_NEXT})

  series: >-
    {SERIES}

  series.withPreviousNext: >-
    {SERIES} ({PREVIOUS_NEXT})

#
# albumPage:
#
#   Albums group together tracks and provide quick access to each of
#   their pages, have release data (and sometimes credits) that are
#   generally inherited by the album's tracks plus commentary and
#   other goodies of their own, and are generally the main object on
#   the wiki!
#
#   Most of the strings on the album info page are tracked under
#   releaseInfo, so there isn't a lot here.
#
albumPage:
  title: "{ALBUM}"

  nav:
    album: "{ALBUM}"

    backToAlbum: "Return to album page"

    albumAccent:
      withNameDetail: >-
        {NAME_DETAIL}

      withType: >-
        {TYPE}

      withNameDetail.withType: >-
        {TYPE}: {NAME_DETAIL}

      type.single: "single" # This string should probably never appear, but...
      type.vgm: "in-game vgm"

      withLinks: >-
        {ACCENT} - {LINKS}

    randomTrack: "Random Track"
    gallery: "Gallery"
    commentary: "Commentary"

  socialEmbed:
    heading: "{GROUP}"
    title: "{ALBUM}"

    # body:
    #   These permutations are a bit awkward. "Tracks" is a counted
    #   string, ex. "63 tracks".

    body:
      withDuration: >-
        {DURATION}.

      withTracks: >-
        {TRACKS}.

      withDateReleased: >-
        Released {DATE}.

      withDatePosted: >-
        Posted {DATE}.

      withDuration.withTracks: >-
        {DURATION}, {TRACKS}.

      withDuration.withDateReleased: >-
        {DURATION}. Released {DATE}.

      withDuration.withDatePosted: >-
        {DURATION}. Posted {DATE}.

      withTracks.withDateReleased: >-
        {TRACKS}. Released {DATE}.

      withTracks.withDatePosted: >-
        {DURATION}. Posted {DATE}.

      withDuration.withTracks.withDateReleased: >-
        {DURATION}, {TRACKS}. Released {DATE}.

      withDuration.withTracks.withDatePosted: >-
        {DURATION}, {TRACKS}. Posted {DATE}.

#
# albumGalleryPage:
#   Album galleries provide an alternative way to navigate the album,
#   and put all its artwork - including for each track - into the
#   spotlight. Apart from the main gallery grid (which usually lists
#   each artwork's illustrators), this page also has a quick stats
#   line about the album, and may display a message about all of the
#   artworks if one applies.
#
albumGalleryPage:
  title: "{ALBUM} - Gallery"

  # statsLine:
  #   Most albums have release dates, but not all. These strings
  #   react accordingly.

  statsLine: >-
    {TRACKS} totaling {DURATION}.

  statsLine.withDateReleased: >-
    {TRACKS} totaling {DURATION}. Released {DATE}.

  statsLine.withDatePosted: >-
    {TRACKS} totaling {DURATION}. Posted {DATE}.

  statsLine.withDateReleased.noDuration: >-
    Released {DATE}.

  statsLine.withDatePosted.noDuration: >-
    Posted {DATE}.

  # coverArtistsLine:
  #   This is displayed if every track (which has artwork at all)
  #   has the same illustration credits.

  coverArtistsLine: >-
    All track artwork by {ARTISTS}.

  # noTrackArtworksLine:
  #   This is displayed if none of the tracks on the album have any
  #   artwork at all. Generally, this means the album gallery won't
  #   be linked from the album's other pages, but it is possible to
  #   end up on "stub galleries" using nav links on another gallery.

  noTrackArtworksLine: >-
    This album doesn't have any track artwork.

  # setSwitcher:
  #   This is displayed if multiple sets of artwork are available
  #   across the album.

  setSwitcher:
    _: "({SETS})"

    unlabeledSet: "Main album art"

#
# albumCommentaryPage:
#   The album commentary page is a more minimal layout that brings
#   the commentary for the album, and each of its tracks, to the
#   front. It's basically inspired by reading in a library, or by
#   following along with an album's booklet or liner notes while
#   playing it back on a treasured dinky CD player late at night.
#
albumCommentaryPage:
  title: "{ALBUM} - Commentary"

  nav:
    album: "Album: {ALBUM}"

  sidebar:
    noTrackCommentary: >-
      No track commentary.

    noCommentary: >-
      No album or track commentary.

  infoLine: >-
    {WORDS} across {ENTRIES}.

  infoLine.withoutCommentary: >-
    This album does not have any commentary.

  entry:
    title:
      albumCommentary:
        _: "{ALBUM}"
        sticky: "{ALBUM} (album commentary)"
        accent: "Listen on: {LISTENING_LINKS}"

      trackCommentary:
        _: "{TRACK}"
        accent: "Listen on: {LISTENING_LINKS}"

#
# artistInfoPage:
#   The artist info page is an artist's main home on the wiki, and
#   automatically includes a full list of all the things they've
#   contributed to and been credited on. It's split into a section
#   for each of the kinds of things the artist is credited for,
#   including tracks, artworks, flashes/games, and commentary.
#
artistPage:
  title: "{ARTIST}"

  nav:
    artist: "Artist: {ARTIST}"

  closelyLinkedGroups:
    one: "This artist has a group page: {GROUP}."
    multiple: "This artist has group pages: {GROUPS}."

    group:
      _: "{GROUP}"
      withAnnotation: "{GROUP} ({ANNOTATION})"

    alias: "This artist is an alias of {GROUPS}."

  creditList:

    # album:
    #   Tracks are chunked by albums, generally all tracks from an
    #   album together in one chunk, but a album may be split into
    #   multiple chunks if the tracks are individually dated and the
    #   artist contributed to some other release between. Date ranges
    #   are shown only if the tracks within a chunk vary in date AND
    #   the album itself has no date.

    album:
      _: "{ALBUM}"

      withCredit: "{ALBUM} {CREDIT}"
      credit:
        by: "by {ARTISTS}"

      withDate: >-
        {ALBUM} ({DATE})

      withDuration: >-
        {ALBUM} ({DURATION})

      withDateRange: >-
        {ALBUM} (tracks {DATE_RANGE})

      withDate.withDuration: >-
        {ALBUM} ({DATE}; {DURATION})

      withDateRange.withDuration: >-
        {ALBUM} (tracks {DATE_RANGE}; {DURATION})

    # flashAct:
    #   Flashes are chunked by flash act, though a single flash act
    #   might be split into multiple chunks if it spans a long range
    #   and the artist contributed to a flash from some other act
    #   between. A date range will be shown if an act has at least
    #   two differently dated flashes.

    flashAct:
      _: "{ACT}"
      withDate: "{ACT} ({DATE})"
      withDateRange: "{ACT} ({DATE_RANGE})"

    # entry:
    #   This section covers strings for all kinds of individual
    #   things which an artist has contributed to, and refers to the
    #   items in each of the chunks described above.

    entry:

      # withAnnotation:
      #   The specific contribution that an artist made to a given
      #   thing may be described with a word or two, and that's shown
      #   in the list.

      withAnnotation: "{ENTRY} — {ANNOTATION}"

      # withCitation:
      #   For commentary entries and the like. These are usually longer
      #   than typical annotations.

      withCitation: "{ENTRY} ({CITATION})"

      citation: "{CITATION}"
      citation.quoted: "quoted: {CITATION}"
      quoted: "quoted"

      # rerelease:
      #   Tracks which aren't the original release don't display co-
      #   artists or contributors, and get dimmed a little compared
      #   to original release track entries.

      rerelease:
        _: "{ENTRY} ({RERELEASE})"
        withAnnotation: "{ENTRY} ({RERELEASE}) — {ANNOTATION}"
        term: "rerelease"

        firstRelease: >-
          First released on {ALBUM}

        notCreditedOnFirstRelease: >-
          {ARTIST} isn't credited on this track's first release.

      firstRelease:
        _: "{ENTRY} ({FIRST_RELEASE})"
        withAnnotation: "{ENTRY} ({FIRST_RELEASE}) — {ANNOTATION}"
        term: "first release"

        rerelease: >-
          Also released on {ALBUM}

      track: "{TRACK}"

      track.musicVideo:
        _: >-
          {TRACK}

        withLinks: >-
          {TRACK}: {LINKS}

        withTitle: >-
          {TRACK} — {TITLE}

        withTitle.withLinks: >-
          {TRACK} — {TITLE}: {LINKS}

        withLabel: >-
          {TRACK} — {LABEL}

        withLabel.withLinks: >-
          {TRACK} — {LABEL}: {LINKS}

        withCredit: >-
          {TRACK}, {CREDIT}

        withCredit.withLinks: >-
          {TRACK}, {CREDIT}: {LINKS}

        withCredit.withTitle: >-
          {TRACK}, {TITLE} {CREDIT}

        withCredit.withTitle.withLinks: >-
          {TRACK}, {TITLE} {CREDIT}: {LINKS}

        withCredit.withLabel: >-
          {TRACK}, {LABEL} {CREDIT}

        withCredit.withLabel.withLinks: >-
          {TRACK}, {LABEL} {CREDIT}: {LINKS}

        withDate: >-
          ({DATE}) {TRACK}

        withDate.withLinks: >-
          ({DATE}) {TRACK}: {LINKS}

        withDate.withTitle: >-
          ({DATE}) {TRACK} — {TITLE}

        withDate.withTitle.withLinks: >-
          ({DATE}) {TRACK} — {TITLE}: {LINKS}

        withDate.withLabel: >-
          ({DATE}) {TRACK} — {LABEL}

        withDate.withLabel.withLinks: >-
          ({DATE}) {TRACK} — {LABEL}: {LINKS}

        withDate.withCredit: >-
          ({DATE}) {TRACK}, {CREDIT}

        withDate.withCredit.withLinks: >-
          ({DATE}) {TRACK}, {CREDIT}: {LINKS}

        withDate.withCredit.withTitle: >-
          ({DATE}) {TRACK}, {TITLE} {CREDIT}

        withDate.withCredit.withTitle.withLinks: >-
          ({DATE}) {TRACK}, {TITLE} {CREDIT}: {LINKS}

        withDate.withCredit.withLabel: >-
          ({DATE}) {TRACK}, {LABEL} {CREDIT}

        withDate.withCredit.withLabel.withLinks: >-
          ({DATE}) {TRACK}, {LABEL} {CREDIT}: {LINKS}

        credit: >-
          video by {ARTISTS}

        credit.alongsideLabel: >-
          by {ARTISTS}

        credit.alongsideTitle: >-
          by {ARTISTS}

      track.miscellaneousAdditionalFile:
        _: >-
          {TITLE}: {TRACK}

        withCredit: >-
          {TITLE} ({CREDIT}): {TRACK}

        withMultipleFiles: >-
          {TITLE}: {TRACK} ({FILES})

        withNoFiles: >-
          {TITLE}: {TRACK} (no files)

        withCredit.withMultipleFiles: >-
          {TITLE} ({CREDIT}): {TRACK} ({FILES})

        withCredit.withNoFiles: >-
          {TITLE} ({CREDIT}): {TRACK} (no files)

        placeholderTitle: "Additional file"
        credit: "by {ARTISTS}"

      track.sheetMusicFile:
        _: >-
          {TITLE}: {TRACK}

        withCredit: >-
          {TITLE} ({CREDIT}): {TRACK}

        withMultipleFiles: >-
          {TITLE}: {TRACK} ({FILES})

        withNoFiles: >-
          {TITLE}: {TRACK} (no files)

        withCredit.withMultipleFiles: >-
          {TITLE} ({CREDIT}): {TRACK} ({FILES})

        withCredit.withNoFiles: >-
          {TITLE} ({CREDIT}): {TRACK} (no files)

        placeholderTitle: "Sheet music"
        credit: "by {ARTISTS}"

      track.midiProjectFile:
        _: >-
          {TITLE}: {TRACK}

        withCredit: >-
          {TITLE} ({CREDIT}): {TRACK}

        withMultipleFiles: >-
          {TITLE}: {TRACK} ({FILES})

        withNoFiles: >-
          {TITLE}: {TRACK} (no files)

        withCredit.withMultipleFiles: >-
          {TITLE} ({CREDIT}): {TRACK} ({FILES})

        withCredit.withNoFiles: >-
          {TITLE} ({CREDIT}): {TRACK} (no files)

        placeholderTitle: "MIDI or project music"
        credit: "by {ARTISTS}"

      # album:
      #   The artist info page doesn't display if the artist is
      #   musically credited outright for the album as a whole,
      #   opting to show each of the tracks from that album instead.
      #   But other parts belonging specifically to the album have
      #   credits too, and those entreis get the strings below.

      album:
        albumArtistOnly: "Credited as album artist only—track credits vary"
        coverArt: "(cover art)"
        wallpaperArt: "(wallpaper art)"
        bannerArt: "(banner art)"
        commentary: "(album commentary)"

      album.musicVideo:
        _: >-
          (album music video)

        withLinks: >-
          (album music video: {LINKS})

        withTitle: >-
          (for album: {TITLE})

        withTitle.withLinks: >-
          (for album: {TITLE} - {LINKS})

        withLabel: >-
          (for album: {LABEL})

        withLabel.withLinks: >-
          (for album: {LABEL} - {LINKS})

        withCredit: >-
          (album music video {CREDIT})

        withCredit.withLinks: >-
          (album music video {CREDIT} - {LINKS})

        withCredit.withTitle: >-
          (for album: {TITLE} {CREDIT})

        withCredit.withTitle.withLinks: >-
          (for album: {TITLE} {CREDIT} - {LINKS})

        withCredit.withLabel: >-
          (for album: {LABEL} {CREDIT})

        withCredit.withLabel.withLinks: >-
          (for album: {LABEL} {CREDIT} - {LINKS})

        withDate: >-
          ({DATE}: album music video)

        withDate.withLinks: >-
          ({DATE}, album music video: {LINKS})

        withDate.withTitle: >-
          ({DATE}, for album: {TITLE})

        withDate.withTitle.withLinks: >-
          ({DATE}, for album: {TITLE} - {LINKS})

        withDate.withLabel: >-
          ({DATE}, for album: {LABEL})

        withDate.withLabel.withLinks: >-
          ({DATE}, for album: {LABEL} - {LINKS})

        withDate.withCredit: >-
          ({DATE}: album music video {CREDIT})

        withDate.withCredit.withLinks: >-
          ({DATE}, album music video {CREDIT} - {LINKS})

        withDate.withCredit.withTitle: >-
          ({DATE}, for album: {TITLE} {CREDIT})

        withDate.withCredit.withTitle.withLinks: >-
          ({DATE}, for album: {TITLE} {CREDIT} - {LINKS})

        withDate.withCredit.withLabel: >-
          ({DATE}, for album: {LABEL} {CREDIT})

        withDate.withCredit.withLabel.withLinks: >-
          ({DATE}, for album: {LABEL} {CREDIT} - {LINKS})

        credit: >-
          by {ARTISTS}

        credit.alongsideLabel: >-
          by {ARTISTS}

        credit.alongsideTitle: >-
          by {ARTISTS}

      album.miscellaneousAdditionalFile:
        _: >-
          (album additional files)

        withTitle: >-
          (for album: {TITLE})

        withCredit: >-
          (for album: {CREDIT})

        withCredit.withTitle: >-
          (for album: {TITLE} {CREDIT})

        credit: >-
          files by {ARTISTS}

        credit.standaloneWithFiles: >-
          {FILES} by {ARTISTS}

        credit.alongsideTitle: >-
          by {ARTISTS}

      flash: "{FLASH}"

      artwork.accent:
        withLabel: >-
          {LABEL}

        withAnnotation: >-
          {ANNOTATION}

        withLabel.withAnnotation: >-
          {LABEL}: {ANNOTATION}

  # contributedDurationLine:
  #   This is shown at the top of the artist's track list, provided
  #   any of their tracks have durations at all.

  contributedDurationLine: >-
    {ARTIST} has contributed {DURATION} of music shared on this wiki.

  # groupContributions:
  #   This is a special "chunk" shown at the top of an artist's
  #   track and artwork lists. It lists which groups an artist has
  #   contributed the most (and least) to, and is interactive -
  #   it can be sorted by count or, for tracks, by duration.

  groupContributions:
    title:
      tracks: "Contributed music to group…"
      artworks: "Contributed art to group…"
      musicVideos: "Contributed to music videos in group…"

    column:
      count.tracks: "Tracks"
      count.artworks: "Artworks"
      count.musicVideos: "Music Videos"
      duration: "Duration"

  filterNotice: "(The list above is filtered. {CLEAR})"
  filterNotice.clear: "Click to stop filtering."

  trackList.title: "Tracks"
  artList.title: "Artworks"
  musicVideoList.title: "Music Videos"
  sheetMusicFileList.title: "Sheet Music Files"
  midiProjectFileList.title: "MIDI & Project Files"
  miscellaneousAdditionalFileList.title: "Additional Files"
  flashList.title: "Flashes"
  commentaryList.title: "Commentary"

  # viewArtGallery:
  #   This is shown twice on the page - once at almost the very top
  #   of the page, just beneath visiting links, and once above the
  #   list of credited artworks, where it gets the longer
  #   orBrowseList form.

  viewArtGallery:
    _: "View {LINK}!"
    orBrowseList: "View {LINK}! Or browse the list:"
    link: "art gallery"

  wikiEditArtworks:
    _: "{ARTIST} has edited these artworks for this wiki:"
    sticky: "Artworks — edited for this wiki"

  wikiEditorCommentary:
    _: "{ARTIST} has written these commentary entries as an editor of this wiki:"
    sticky: "Commentary — written for this wiki"

#
# artistGalleryPage:
#   The artist gallery page shows a neat grid of all of the album and
#   track artworks an artist has contributed to! Co-illustrators are
#   also displayed when applicable.
#
artistGalleryPage:
  title: "{ARTIST} - Gallery"

  infoLine: >-
    Contributed to {COVER_ARTS}.

artistRollingWindowPage:
  title: "{ARTIST} - Rolling Window"

  windowConfigurationLine: >-
    With a rolling window of {TIME_BEFORE} before a given date, and {TIME_AFTER} after, peeking ahead {PEEK}...

  contributionConfigurationLine: >-
    Selecting {KIND} contributions from group {GROUP}...

  timeframeSelectionLine:
    _: >-
      There are {CONTRIBUTIONS} contributions, making {TIMEFRAMES} timeframes between {FIRST_DATE} and {LAST_DATE}.
