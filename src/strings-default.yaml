    noExternalLinkPlatformName: "Other"

    chronology:
      heading:
        artistReleases: "Releases by {ARTIST}:"
        artistTracks: "Tracks by {ARTIST}:"

      previous:
        symbol: "←"
        info:
          _: "Previous by this artist"
          withKind: "Previous {KIND} by this artist"

      next:
        symbol: "→"
        info:
          _: "Next by this artist"
          withKind: "Next {KIND} by this artist"

      kind:
        album: "album"
        bannerArt: "banner art"
        coverArt: "cover art"
        flash: "flash"
        midiProjectFile: "midi / project file"
        miscellaneousAdditionalFile: "additional file"
        musicVideo: "music video"
        musicVideoContribution: "video contribution"
        release: "release"
        sheetMusicFile: "sheet music file"
        track: "track"
        trackArt: "track art"
        trackContribution: "track contribution"
        wallpaperArt: "wallpaper art"

  creditingSources:
