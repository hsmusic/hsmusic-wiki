name: Manual Preview Build

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which GitHub Environment to use
        type: environment
        default: preview
      fast_build:
        description: Prune data and media for a faster build
        type: boolean
        default: false
      languages:
        description: JSON array of language codes
        type: string
        default: '["en"]'
      code_branch:
        description: Branch for hsmusic-wiki
        type: string
        default: preview
      data_branch:
        description: Branch for hsmusic-data
        type: string
        default: preview
      media_branch:
        description: Branch for hsmusic-media
        type: string
        default: preview
      lang_branch:
        description: Branch for hsmusic-lang
        type: string
        default: preview

concurrency:
  group: hsmusic-${{ github.workflow }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  build_preview:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 360

    steps:
      - name: Checkout wiki
        uses: actions/checkout@v4
        with:
          repository: hsmusic/hsmusic-wiki
          ref: ${{ inputs.code_branch }}
          path: code

      - name: Checkout data
        uses: actions/checkout@v4
        with:
          repository: hsmusic/hsmusic-data
          ref: ${{ inputs.data_branch }}
          path: data

      - name: Checkout media
        uses: actions/checkout@v4
        with:
          repository: hsmusic/hsmusic-media
          ref: ${{ inputs.media_branch }}
          path: media

      - name: Checkout lang
        uses: actions/checkout@v4
        with:
          repository: hsmusic/hsmusic-lang
          ref: ${{ inputs.lang_branch }}
          path: lang

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: code/package-lock.json

      - name: Install ImageMagick
        uses: mfinelli/setup-imagemagick@v7

      - name: Ensure AWS CLI present
        run: |
          if ! command -v aws >/dev/null 2>&1; then
            echo "Installing AWS CLI"
            sudo apt-get update
            sudo apt-get install -y awscli
          fi
          aws --version

      - name: Install and link CLI
        run: |
          cd code
          npm ci --no-audit --prefer-offline --progress=false
          npm link

      - name: Optional prune for fast build
        if: ${{ inputs.fast_build }}
        run: |
          cd code
          scripts/prune-fast-build.sh

      - name: Generate thumbnails and size cache
        run: |
          cd code
          hsmusic --thumbs-only --data-path ../data --media-path ../media --cache-path ../cache --lang-path ../lang
          hsmusic --skip-thumbs --live-dev-server --skip-serving --data-path ../data --media-path ../media --cache-path ../cache --lang-path ../lang

      - name: Upload media caches and thumbnails
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_MEDIA_BUCKET: ${{ vars.AWS_MEDIA_BUCKET }}
        run: |
          aws s3 cp \
            cache/media-cache/thumbnail-cache.json "$AWS_MEDIA_BUCKET"/ \
            --acl public-read --quiet
          aws s3 cp \
            media/file-size-cache.json "$AWS_MEDIA_BUCKET"/ \
            --acl public-read --quiet
          aws s3 sync \
            media "$AWS_MEDIA_BUCKET" --acl public-read --exclude '.git/*' --quiet
          aws s3 sync \
            cache/media-cache "$AWS_MEDIA_BUCKET" --acl public-read --quiet

      - name: Build and deploy for each language
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_SITE_BUCKET: ${{ vars.AWS_SITE_BUCKET }}
          LANGUAGES_JSON: ${{ inputs.languages }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq
          cd code
          rm -rf ../out && mkdir ../out
          for lang in $(echo "$LANGUAGES_JSON" | jq -r '.[]'); do
            echo "Building language: $lang"
            hsmusic \
              --lang "$lang" \
              --skip-thumbs \
              --urls online-media \
              --static-build \
              --data-path ../data \
              --media-path ../media \
              --cache-path ../cache \
              --lang-path ../lang \
              --out-path ../out
            aws s3 sync ../out "$AWS_SITE_BUCKET" --acl public-read --quiet
          done
