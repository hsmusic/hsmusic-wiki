name: Preview Build

on:
  workflow_dispatch:
    inputs:
      fast_build:
        description: 'Prune data/media for ~20-min build (true/false)'
        default: 'true'
        required: false
      languages:
        description: 'JSON array of language codes, e.g. ["en","es"]'
        default: '["en","es"]'
        required: false
      code_branch:
        description: 'Branch for hsmusic-wiki'
        default: 'preview'
        required: false
      data_branch:
        description: 'Branch for hsmusic-data'
        default: 'preview'
        required: false
      media_branch:
        description: 'Branch for hsmusic-media'
        default: 'preview'
        required: false
      lang_branch:
        description: 'Branch for hsmusic-lang'
        default: 'preview'
        required: false

concurrency:
  group: preview-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: [self-hosted, hsmusic-preview]
    steps:
      - name: Pull latest repos
        shell: bash
        run: |
          declare -A B=( \
            [code]="${{ inputs.code_branch }}" \
            [data]="${{ inputs.data_branch }}" \
            [media]="${{ inputs.media_branch }}" \
            [lang]="${{ inputs.lang_branch }}" )
          for repo in code data media lang; do
            git -C "$HSMUSIC_BASE/$repo" fetch --prune
            git -C "$HSMUSIC_BASE/$repo" checkout "${B[$repo]}"
            git -C "$HSMUSIC_BASE/$repo" reset --hard "origin/${B[$repo]}"
          done

      - name: Prune for fast build
        if: inputs.fast_build == 'true'
        run: "$HSMUSIC_BASE/code/scripts/prune-fast-build.sh"

      - name: Install Node deps
        run: |
          cd "$HSMUSIC_BASE/code"
          npm ci --prefer-offline --no-audit --progress=false

      - name: Generate & upload media caches
        run: |
          cd "$HSMUSIC_BASE"
          hsmusic --thumbs-only
          hsmusic --skip-thumbs --live-dev-server --skip-serving
          aws s3 cp cache/media-cache/thumbnail-cache.json "$HSMUSIC_MEDIA_BUCKET/" --acl public-read
          aws s3 cp media/file-size-cache.json             "$HSMUSIC_MEDIA_BUCKET/" --acl public-read

      - name: Sync originals & thumbs
        run: |
          cd "$HSMUSIC_BASE"
          aws s3 sync media            "$HSMUSIC_MEDIA_BUCKET" --acl public-read --exclude '.git/*'
          aws s3 sync cache/media-cache "$HSMUSIC_MEDIA_BUCKET" --acl public-read

  build:
    needs: prepare
    runs-on: [self-hosted, hsmusic-preview]
    strategy:
      matrix:
        language: ${{ fromJson(inputs.languages) }}
      # max-parallel: 1

    steps:
      - name: Build & deploy site for ${{ matrix.language }}
        shell: bash
        run: |
          cd "$HSMUSIC_BASE"
          rm -rf out && mkdir out
          hsmusic --lang "${{ matrix.language }}" --skip-thumbs --urls online-media --static-build
          aws s3 sync out "$HSMUSIC_PREVIEW_BUCKET" --acl public-read
